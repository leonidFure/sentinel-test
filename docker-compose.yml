# Кворум Redis Sentinel в сети sentinel-net.
# Клиент: node1:26379, node2:26379, node3:26379, мастер mymaster.
# Порты на хосте — только для redis-cli.
# Конфиги: conf/sentinel.conf, conf/redis-common.conf, conf/node*-redis.conf.

x-node: &node
  image: redis:7.4-alpine
  restart: unless-stopped
  networks: [sentinel-net]
  entrypoint: ["/bin/sh", "-c"]
  command:
    - |
      set -eu
      umask 0077
      cp /conf/sentinel.conf /data/sentinel.conf
      chmod 600 /data/sentinel.conf
      if [ -z "$${REDIS_CONF:-}" ]; then
        exec redis-sentinel /data/sentinel.conf
      fi
      redis-server "$$REDIS_CONF" &
      RPID=$$!
      redis-sentinel /data/sentinel.conf &
      SPID=$$!
      trap 'kill $$RPID $$SPID 2>/dev/null || true; exit 0' TERM INT
      wait -n || exit 1
      exit 1
  healthcheck:
    test: ["CMD-SHELL", "redis-cli -t 2 -p 26379 ping && { [ -z \"$$REDIS_CONF\" ] || redis-cli -t 2 -p 6379 ping; }"]
    interval: 3s
    timeout: 3s
    retries: 20
    start_period: 5s

services:
  node1:
    <<: *node
    container_name: node1
    environment:
      REDIS_CONF: /conf/node1-redis.conf
    ports:
      - "6379:6379"
      - "26379:26379"
    volumes:
      - node1-data:/data
      - ./conf:/conf:ro

  node2:
    <<: *node
    container_name: node2
    depends_on:
      node1:
        condition: service_healthy
    environment:
      REDIS_CONF: /conf/node2-redis.conf
    ports:
      - "6380:6379"
      - "26380:26379"
    volumes:
      - node2-data:/data
      - ./conf:/conf:ro

  node3:
    <<: *node
    container_name: node3
    depends_on:
      node1:
        condition: service_healthy
    ports:
      - "26381:26379"
    volumes:
      - node3-data:/data
      - ./conf:/conf:ro

networks:
  sentinel-net:
    name: sentinel-net

volumes:
  node1-data:
  node2-data:
  node3-data:
